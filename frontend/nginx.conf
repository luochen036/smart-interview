# Docker 内置 DNS（127.0.0.11），让服务名动态解析
# ⚠️ 必须用变量 + resolver：直接写 proxy_pass http://gateway:9000 会在 nginx 启动时
# 缓存 gateway 的 IP，容器重建换 IP 后 nginx 还连旧地址 → 502
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    client_max_body_size 9m;
    # 入口文件不缓存；带哈希的 JS/CSS 仍可由浏览器正常复用。
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;   # Vue 路由刷新不 404
    }
    location /api/ {
        set $gateway_upstream gateway;      # 变量触发运行时解析
        proxy_pass http://$gateway_upstream:9000;   # 接口转发给网关（服务名互访）
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
